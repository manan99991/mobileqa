name: Get It Listed — brain probe
on:
  push:
    branches: [getitlisted-engine]
    paths: [".github/workflows/gil-brain-probe.yml"]
permissions: { contents: read, models: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Raw responses
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          echo "== catalog"; curl -sS -i https://models.github.ai/catalog/models -H "Authorization: Bearer $GITHUB_TOKEN" | head -c 1500; echo
          for m in openai/gpt-4o-mini openai/gpt-4.1 openai/gpt-4o; do
            echo "== chat $m"
            curl -sS -i https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" \
              -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"Say OK\"}]}" | head -c 1500; echo
          done
