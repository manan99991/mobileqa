# Get It Listed — black-box QA run.
# Give it a customer's APK (a URL) + their app_key; it installs the app on a free
# Linux emulator, tests it end-to-end with the key-free crawler (no AI, no cost), renders the
# customer report and publishes it to the Get It Listed dashboard (Supabase).
#
# Trigger by hand (Actions tab) OR programmatically via repository_dispatch:
#   POST /repos/manan99991/mobileqa/dispatches
#     {"event_type":"gil-test","client_payload":{"apk_url":"…","app_key":"…","app_name":"…"}}
#
# One-time repo secrets (Settings → Secrets → Actions):
#   SB_URL            https://ljdedtgsijrettyrggpy.supabase.co
#   SB_SERVICE_KEY    Supabase service-role key (never public)

name: Get It Listed — test an app

on:
  workflow_dispatch:
    inputs:
      apk_url:  { description: "Direct URL to the customer's APK", required: true }
      app_key:  { description: "Client app_key (matches clients.app_key)", required: true }
      app_name: { description: "App display name", required: false, default: "Customer app" }
      minutes:  { description: "Crawl budget in minutes", required: false, default: "12" }
  repository_dispatch:
    types: [gil-test]
  # smoke test: any engine change on this branch is proven on a real open-source app
  push:
    branches: [getitlisted-engine]
    paths: ["getitlisted/**", ".github/workflows/getitlisted.yml"]

env:
  SB_URL: ${{ secrets.SB_URL }}
  SB_SERVICE_KEY: ${{ secrets.SB_SERVICE_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve inputs
        id: in
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "apk_url=${{ github.event.client_payload.apk_url }}"   >> $GITHUB_OUTPUT
            echo "app_key=${{ github.event.client_payload.app_key }}"   >> $GITHUB_OUTPUT
            echo "app_name=${{ github.event.client_payload.app_name }}" >> $GITHUB_OUTPUT
            echo "minutes=${{ github.event.client_payload.minutes || 12 }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "apk_url=https://f-droid.org/repo/org.fossify.notes_13.apk" >> $GITHUB_OUTPUT
            echo "app_key=smoke-test" >> $GITHUB_OUTPUT
            echo "app_name=Fossify Notes (smoke test)" >> $GITHUB_OUTPUT
            echo "minutes=6" >> $GITHUB_OUTPUT
          else
            echo "apk_url=${{ github.event.inputs.apk_url }}"   >> $GITHUB_OUTPUT
            echo "app_key=${{ github.event.inputs.app_key }}"   >> $GITHUB_OUTPUT
            echo "app_name=${{ github.event.inputs.app_name }}" >> $GITHUB_OUTPUT
            echo "minutes=${{ github.event.inputs.minutes }}"   >> $GITHUB_OUTPUT
          fi

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af > /dev/null 2>&1 || true
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Download the customer APK
        run: |
          curl -fSL "${{ steps.in.outputs.apk_url }}" -o app.apk
          ls -la app.apk
          file app.apk | grep -qiE "archive|android" || echo "::warning::downloaded file may not be an APK"

      - name: Detect package + activity (aapt)
        id: pkg
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1)
          PKG=$("$AAPT" dump badging app.apk | awk -F"'" '/package: name=/{print $2}')
          echo "package=$PKG" >> $GITHUB_OUTPUT
          echo "detected package: $PKG"
          [ -n "$PKG" ] || { echo "::error::could not read package from APK"; exit 1; }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, explore, publish
        env:
          GIL_APK: ./app.apk
          GIL_PACKAGE: ${{ steps.pkg.outputs.package }}
          GIL_APP_NAME: ${{ steps.in.outputs.app_name }}
          GIL_APP_KEY: ${{ steps.in.outputs.app_key }}
          GIL_PLATFORM: Android
          GIL_MINUTES: ${{ steps.in.outputs.minutes }}
        run: |
          set +e
          exec > >(tee mobileqa.log) 2>&1
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"; mkdir -p "$ANDROID_AVD_HOME"
          yes | sdkmanager "system-images;android-30;google_apis;x86_64" >/dev/null 2>&1 && echo "image installed"
          echo no | avdmanager --verbose create avd --force --name qa \
            --package "system-images;android-30;google_apis;x86_64" --device pixel_6 2>&1 | tail -4
          emulator -list-avds | grep -qx qa || { echo "AVD creation FAILED"; exit 1; }
          nohup emulator -avd qa -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot -netdelay none -netspeed full > emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          booted=0
          for i in $(seq 1 60); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && { echo "booted after ${i}x5s"; booted=1; break; }
            sleep 5
          done
          [ "$booted" = "1" ] || { echo "EMULATOR DID NOT BOOT"; tail -20 emulator.log; exit 1; }
          adb shell input keyevent 82 >/dev/null 2>&1 || true
          echo "== install app =="
          adb install -r -g app.apk || { echo "::error::APK would not install"; exit 1; }
          echo "== start screen recording (rolling 170s segments) =="
          mkdir -p /tmp/vid
          ( n=0; while true; do adb shell screenrecord --time-limit 170 --bit-rate 2000000 /sdcard/seg_$n.mp4 2>/dev/null; adb pull /sdcard/seg_$n.mp4 /tmp/vid/ 2>/dev/null; n=$((n+1)); done ) &
          REC_PID=$!
          echo "== crawl + stress (key-free) =="
          timeout --signal=TERM 28m python getitlisted/crawler.py explore
          rc=$?; echo "== crawler exit $rc =="
          kill $REC_PID 2>/dev/null; sleep 3
          RUN_DIR=$(ls -dt reports/*/ 2>/dev/null | head -1)
          [ -z "$RUN_DIR" ] && { echo "::warning::no run dir"; exit 0; }
          echo "run dir: $RUN_DIR"
          cp -r /tmp/vid "$RUN_DIR/video" 2>/dev/null || true
          # full device log — trust.py keeps ONLY the app's own crashes from it
          adb logcat -d > "$RUN_DIR/logcat.txt" 2>/dev/null || true
          # device profile + foreground sanity (did the app actually run?)
          export RD="$RUN_DIR"
          export MODEL=$(adb shell getprop ro.product.model | tr -d '\r')
          export API=$(adb shell getprop ro.build.version.sdk | tr -d '\r')
          export DENS=$(adb shell wm density | grep -o '[0-9]*' | head -1)
          export SZ=$(adb shell wm size | grep -o '[0-9]*x[0-9]*' | head -1)
          export FG=$(adb shell "dumpsys activity activities | grep -c $GIL_PACKAGE" | tr -d '\r')
          python3 -c "import json,os;s=(os.environ.get('SZ','') or '').split('x');json.dump({'model':os.environ.get('MODEL') or 'Android emulator','api':os.environ.get('API'),'density':os.environ.get('DENS'),'width':(s+[''])[0],'height':(s+['',''])[1],'foregrounded':int(os.environ.get('FG') or 0)>0}, open(os.environ['RD']+'/device.json','w'))"
          echo "== reproduce pass (replay every crash 3x from a clean install) =="
          timeout 10m python getitlisted/crawler.py replay "$RUN_DIR" 3 || echo "::warning::reproduce pass incomplete"
          # TRUST GATE: keep only app-scoped, reproduced crashes; drop env/system noise
          echo "== trust gate =="
          GIL_RUN_DIR="$RUN_DIR" python getitlisted/trust.py || echo "::warning::trust gate error"
          echo "== result summary =="
          python3 -c "import json,sys;d=sys.argv[1];s=json.load(open(d+'summary.json'))['summary'];print('screens',s['screens'],'actions',s['steps'],'perf',json.dumps(s.get('performance')));print('integrations',s.get('integrations'));print('declared',s.get('declared'));[print('FINDING',f['severity'],f['category'],f['title'],'|',f.get('reproduction','')) for f in json.load(open(d+'findings.trusted.json'))];print(open(d+'run_meta.json').read()[:1500])" "$RUN_DIR" || true
          # publish (push honors an 'inconclusive' run_meta and publishes nothing)
          if [ -n "$SB_URL" ]; then
            echo "== publish =="
            GIL_RUN_DIR="$RUN_DIR" GIL_VIDEO_DIR=/tmp/vid python getitlisted/push.py || echo "::warning::publish failed"
          else
            echo "::warning::no SB_URL — skipping publish"
          fi

      # The real report goes to Supabase (free). Only keep a GitHub copy when a
      # run FAILS, and only for 2 days, so this never fills the account's free
      # Actions storage. Success runs upload nothing.
      - name: Upload report artifact (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: gil-qa-report, path: reports/, retention-days: 2 }
