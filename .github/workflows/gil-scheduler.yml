# Get It Listed — automatic test scheduler.
# Every 30 minutes: new customer uploads get tested, and each active paid app is
# re-tested once a day for its 14 days. Only build ids pass through here; no stored keys.
name: Get It Listed — scheduler

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency: { group: gil-scheduler, cancel-in-progress: false }

jobs:
  pick:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    outputs:
      ids: ${{ steps.p.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: getitlisted-engine }
      - id: p
        run: |
          ids=$(cd getitlisted && python3 queue.py pick 2>/dev/null) || { echo "engine-api not ready yet"; ids='[]'; }
          echo "ids=$ids" >> $GITHUB_OUTPUT
          echo "builds to test: $ids"

  test:
    needs: pick
    if: needs.pick.outputs.ids != '[]' && needs.pick.outputs.ids != ''
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        build_id: ${{ fromJSON(needs.pick.outputs.ids) }}
    permissions: { contents: read, id-token: write }
    uses: manan99991/mobileqa/.github/workflows/getitlisted.yml@getitlisted-engine
    with:
      build_id: ${{ format('{0}', matrix.build_id) }}
