# Tenzy — iOS. Repo: manan99991/putt-party-play (NATIVE SwiftUI, Xcode project via XcodeGen — NOT Expo).
# App target HandyTools, bundle com.tenzy.toolkit. iOS already has a GREEN GitHub Actions build/test pipeline —
# mirror that build, then install the resulting .app on a simulator for the agent.
# Build for simulator:  xcodegen && xcodebuild -scheme HandyTools -sdk iphonesimulator -configuration Debug -derivedDataPath build
#   -> build/Build/Products/Debug-iphonesimulator/HandyTools.app
app:
  name: Tenzy
  path: ${TENZY_APP:-}           # the simulator HandyTools.app; blank if already installed
  bundle_id: com.tenzy.toolkit
  login: {}
  base_urls:
    - https://manan99991.github.io/tenzy/
    - https://manan99991.github.io/tenzy/privacy.html
  allow_destructive: false
  forbidden_texts: ["Subscribe", "Start free trial", "Buy", "Restore purchases", "Rate", "Send feedback", "Delete"]
  # Tenzy is built FOR automated testing. Launch args below enable uitest mode (skip onboarding + paywall + crash
  # dialog) and preload a sample so each tool has input. Open a specific tool with: -route <toolId>.
  # 30 tool route ids: fitit scan studio video formatfix scrub cleaner qrwifi stitch shareready light contacts
  #   measure magnify procam gpsdash audiolab rest colorvision sorted textstudio translate voicenotes
  #   livecaptions shield lens memory datagrab describe vault
  goals:
    - "Open every one of the 30 tools (fitit, scan, studio, video, formatfix, scrub, cleaner, qrwifi, stitch, shareready, light, contacts, measure, magnify, procam, gpsdash, audiolab, rest, colorvision, sorted, textstudio, translate, voicenotes, livecaptions, shield, lens, memory, datagrab, describe, vault) and exercise each with sensible input, checking the result is correct"
    - "Free tier vs Pro paywall behaves correctly; 'free' never appears without 'optional Pro subscription'"
    - "Every screen, modal and sub-screen has a visible Back or Done (App Store dead-end check)"
    - "Privacy policy and every external link open and are not 404"
    - "Rotate to landscape in two tools; nothing clipped; state kept"
    - "Background the app mid-tool and come back: input is preserved"
  known_issues: []
  # Route-seeding (agent feature, on main): the explorer opens every tool via the app's URL scheme
  # so all 30 are entered and explored, not just the handful reachable by tapping from home. On iOS
  # routes MUST be full URL deep links (the agent opens them with mobile:deepLink). uitest mode
  # (above) keeps onboarding/paywall out of the way; Pro tools still open so their screens get checked.
  routes:
    - tenzy://tool/fitit
    - tenzy://tool/scan
    - tenzy://tool/studio
    - tenzy://tool/video
    - tenzy://tool/formatfix
    - tenzy://tool/scrub
    - tenzy://tool/cleaner
    - tenzy://tool/qrwifi
    - tenzy://tool/stitch
    - tenzy://tool/shareready
    - tenzy://tool/light
    - tenzy://tool/contacts
    - tenzy://tool/measure
    - tenzy://tool/magnify
    - tenzy://tool/procam
    - tenzy://tool/gpsdash
    - tenzy://tool/audiolab
    - tenzy://tool/rest
    - tenzy://tool/colorvision
    - tenzy://tool/sorted
    - tenzy://tool/textstudio
    - tenzy://tool/translate
    - tenzy://tool/voicenotes
    - tenzy://tool/livecaptions
    - tenzy://tool/shield
    - tenzy://tool/lens
    - tenzy://tool/memory
    - tenzy://tool/datagrab
    - tenzy://tool/describe
    - tenzy://tool/vault

device:
  platform: ios
  name: iPhone 15
  os_version: "17.5"
  udid: ""                        # workflow sets this to the booted simulator
  appium_url: ${APPIUM_URL:-http://127.0.0.1:4723}
  extra_caps:
    # uitest mode: skip onboarding/paywall/crash-dialog, preload a sample input.
    appium:processArguments:
      args: ["-uitest", "-sample"]

run:
  max_steps: 400
  max_minutes: 40
  check_links: true
  check_values: true
  check_a11y: true
  check_vision: true
  model: claude-sonnet-5-5
  suite_dir: qa/suite/ios
  report_dir: reports
  fail_on: [critical, high]
