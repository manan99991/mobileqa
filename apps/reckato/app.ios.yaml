# Reckato — iOS. Repo: manan99991/app-calculator (Expo). Bundle com.reckato.app.
# Build the simulator binary (needs eas.json profile qa-simulator with ios.simulator: true):
#   npx eas-cli build --platform ios --profile qa-simulator --local --output qa-build.tar.gz && tar -xzf qa-build.tar.gz
app:
  name: Reckato
  path: ${APP_PATH:-}             # the workflow sets APP_PATH to the simulator .app; blank if installed
  bundle_id: com.reckato.app
  login: {}                       # no accounts in Reckato
  base_urls:
    - https://reckato.app
  allow_destructive: false
  forbidden_texts: ["Purchase", "Subscribe", "Buy", "Restore purchases", "Rate", "Send feedback"]
  goals:
    - "Open the standard keypad, enter 12.5 × 8 = and confirm the result reads 100"
    - "Open every tool in the menu (all 34), use it once with sensible input, and check the answer is arithmetically right"
    - "Unit converter: convert 10 km to miles and confirm 6.21"
    - "Currency converter works offline (airplane mode) and shows a last-updated date"
    - "Local tax: pick a place, enter an amount, verify tax = amount × rate shown"
    - "Every screen, modal and sub-screen has a visible Back or Done (store-review dead-end check)"
    - "Every external link opens and is not a 404 (sources pages, privacy policy, website)"
    - "Switch each theme in Settings and confirm text stays readable (contrast)"
    - "Rotate to landscape on the keypad and a form calculator; nothing clipped"
    - "Pro paywall: shows price, renewal terms, trial and cancel info; the word 'free' never appears without 'optional Pro'"
  known_issues: []

device:
  platform: ios
  name: iPhone 15
  os_version: "17.5"
  udid: ${SIM_UDID:-}            # workflow sets this; or a real iPhone's UDID
  appium_url: ${APPIUM_URL:-http://127.0.0.1:4723}

run:
  max_steps: 60
  max_minutes: 15
  check_links: true
  check_values: true
  check_a11y: true
  check_vision: true
  model: claude-sonnet-5-5
  suite_dir: qa/suite/ios
  report_dir: reports
  fail_on: [critical, high]
