# Get It Listed — test one app on a free Android emulator with the key-free engine.
#
# Customer runs come from the scheduler (gil-scheduler.yml) with only a build_id.
# Everything about the customer (app, package, links, login) is fetched inside the job
# and masked, because logs of a public repo are public. Nothing is uploaded to GitHub.
#
# No stored keys: each run proves itself to the engine-api function with a GitHub OIDC token.

name: Get It Listed — test an app

on:
  workflow_call:
    inputs:
      build_id: { type: string, required: false, default: "" }
      # internal runs (our own apps): build the APK from a public repo inside this job (nothing uploaded)
      source_repo:  { type: string, required: false, default: "" }
      source_ref:   { type: string, required: false, default: "" }
      source_build: { type: string, required: false, default: "" }
      source_apk:   { type: string, required: false, default: "" }
      app_key:  { type: string, required: false, default: "" }
      app_name: { type: string, required: false, default: "" }
      minutes:  { type: string, required: false, default: "" }
      agent_minutes: { type: string, required: false, default: "" }
      plan_dir: { type: string, required: false, default: "" }
      seed:     { type: boolean, required: false, default: true }
  workflow_dispatch:
    inputs:
      build_id: { description: "builds.id to test", required: true }
  # smoke test: any engine change is proven on a real open-source app
  push:
    branches: [getitlisted-engine, main]
    paths: ["getitlisted/**", ".github/workflows/getitlisted.yml"]

permissions:
  contents: read
  id-token: write

env:
  BUILD_ID: ${{ inputs.build_id }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GIL_AGENT_MINUTES: ${{ inputs.agent_minutes || '40' }}
  GIL_PLAN_DIR: ${{ inputs.plan_dir }}
  GIL_VERBOSE: ${{ inputs.source_repo != '' && '1' || '0' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with: { repository: manan99991/mobileqa, ref: getitlisted-engine }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Get internal source
        if: inputs.source_repo != ''
        uses: actions/checkout@v4
        with: { repository: "${{ inputs.source_repo }}", ref: "${{ inputs.source_ref }}", path: internal-src }
      - if: inputs.source_repo != ''
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - if: inputs.source_repo != ''
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Build internal app
        if: inputs.source_repo != ''
        working-directory: internal-src
        run: |
          ( ${{ inputs.source_build }} ) > ../internal-build.log 2>&1 || { tail -40 ../internal-build.log; exit 1; }
          mkdir -p ../internal && cp ${{ inputs.source_apk }} ../internal/
          echo "built: $(ls ../internal)"

      - name: Load build (masked)
        run: |
          if [ -n "${{ inputs.source_repo }}" ]; then
            cp "$(ls internal/*.apk | head -1)" app.apk
            { echo "GIL_APP_KEY=${{ inputs.app_key }}"; echo "GIL_APP_NAME=${{ inputs.app_name }}"
              echo "GIL_MINUTES=${{ inputs.minutes || '30' }}"; echo "GIL_SMOKE=0"; echo "GIL_INTERNAL=1"; } >> $GITHUB_ENV
          elif [ -n "$BUILD_ID" ]; then
            cd getitlisted && python queue.py fetch "$BUILD_ID" && cd ..
            echo "GIL_SMOKE=0" >> $GITHUB_ENV
          else
            { echo "GIL_APK_URL=https://f-droid.org/repo/org.fossify.notes_13.apk"
              echo "GIL_APP_KEY=smoke-test"; echo "GIL_APP_NAME=Fossify Notes (smoke test)"
              echo "GIL_MINUTES=6"; echo "GIL_SMOKE=1"; } >> $GITHUB_ENV
          fi

      - name: Download the app
        if: env.GIL_INTERNAL != '1'
        run: |
          curl -fsSL "$GIL_APK_URL" -o app.apk || { echo "::error::could not download the build"; exit 1; }
          [ -n "$GIL_MAPPING_URL" ] && curl -fsSL "$GIL_MAPPING_URL" -o mapping.txt || true
          ls -la app.apk | awk '{print "apk bytes:", $5}'

      - name: Read package (masked)
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1)
          PKG=$("$AAPT" dump badging app.apk 2>/dev/null | awk -F"'" '/package: name=/{print $2}')
          [ -n "$PKG" ] || { echo "::error::this file is not a valid APK"; exit 1; }
          [ "$GIL_SMOKE" = "1" ] || echo "::add-mask::$PKG"
          echo "GIL_PACKAGE=$PKG" >> $GITHUB_ENV
          "$AAPT" dump badging app.apk > badging.txt 2>/dev/null || true
          mkdir -p appmeta && python3 getitlisted/appinfo.py app.apk badging.txt appmeta >/dev/null || true

      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Test the app
        env:
          GIL_PLATFORM: Android
        run: |
          set +e
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"; mkdir -p "$ANDROID_AVD_HOME"
          export GIL_MINUTES="${GIL_MINUTES:-12}"
          yes | sdkmanager "system-images;android-30;google_apis;x86_64" >/dev/null 2>&1 && echo "image installed"
          echo no | avdmanager create avd --force --name qa \
            --package "system-images;android-30;google_apis;x86_64" --device pixel_6 >/dev/null 2>&1
          emulator -list-avds | grep -qx qa || { echo "AVD creation FAILED"; exit 1; }
          nohup emulator -avd qa -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot -netdelay none -netspeed full > emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          booted=0
          for i in $(seq 1 60); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && { echo "emulator booted"; booted=1; break; }
            sleep 5
          done
          [ "$booted" = "1" ] || { echo "EMULATOR DID NOT BOOT"; exit 1; }
          adb shell input keyevent 82 >/dev/null 2>&1 || true
          adb install -r -g app.apk >/dev/null 2>&1 || { echo "::error::the APK would not install"; exit 1; }
          echo "app installed"
          if [ "${{ inputs.seed != false }}" = "true" ]; then
            (command -v ffmpeg >/dev/null || sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1)
            pip install -q pillow >/dev/null 2>&1
            timeout 6m python getitlisted/seed_device.py || echo "seeding incomplete"
          fi

          mkdir -p /tmp/vid
          # rolling 170 s segments; index.txt records each segment's start time so findings can link to the exact moment
          ( n=0; while true; do echo "seg_$n.mp4 $(date +%s.%N)" >> /tmp/vid/index.txt
              adb shell screenrecord --time-limit 170 --bit-rate 2000000 /sdcard/seg_$n.mp4 2>/dev/null; n=$((n+1)); done ) &
          REC_PID=$!

          timeout --signal=TERM $((GIL_MINUTES + 25))m python getitlisted/crawler.py explore
          echo "crawler exit $?"
          RUN_DIR=$(ls -dt reports/*/ 2>/dev/null | head -1)
          [ -z "$RUN_DIR" ] && { echo "::error::no run output"; exit 1; }
          echo "== deep functional testing (learn -> plan -> run -> verify -> confirm) =="
          if [ -n "$GEMINI_API_KEY" ] || [ -n "$GIL_PLAN_DIR" ]; then
            pip install -q pillow >/dev/null 2>&1
            [ -n "$GEMINI_API_KEY" ] && echo "brain: Gemini" || echo "brain: none (running the written test plan with device checks only)"
            timeout --signal=TERM $(( ${GIL_AGENT_MINUTES:-40} + 15 ))m python getitlisted/agent.py "$RUN_DIR"
            echo "agent exit $?"
          else
            echo "no AI key: functional testing skipped"
            python3 -c "import json,sys;open(sys.argv[1]+'/test_results.json','w').write(json.dumps({'skipped':'no AI key configured','results':[]}))" "$RUN_DIR"
          fi
          kill $REC_PID 2>/dev/null; adb shell pkill -INT screenrecord 2>/dev/null; sleep 4
          for f in $(adb shell ls /sdcard/ 2>/dev/null | tr -d '\r' | grep '^seg_.*mp4$'); do adb pull /sdcard/$f /tmp/vid/ >/dev/null 2>&1; done
          echo "video segments: $(ls /tmp/vid/*.mp4 2>/dev/null | wc -l)"

          adb logcat -d > "$RUN_DIR/logcat.txt" 2>/dev/null
          # release builds: turn obfuscated stack frames back into real class/line names
          if [ -s mapping.txt ] && command -v retrace >/dev/null; then
            retrace mapping.txt "$RUN_DIR/logcat.txt" > "$RUN_DIR/logcat.r.txt" 2>/dev/null && [ -s "$RUN_DIR/logcat.r.txt" ] \
              && mv "$RUN_DIR/logcat.r.txt" "$RUN_DIR/logcat.txt" && echo "stack traces de-obfuscated"
          fi
          export RD="$RUN_DIR"
          export MODEL=$(adb shell getprop ro.product.model | tr -d '\r')
          export API=$(adb shell getprop ro.build.version.sdk | tr -d '\r')
          export DENS=$(adb shell wm density | grep -o '[0-9]*' | head -1)
          export SZ=$(adb shell wm size | grep -o '[0-9]*x[0-9]*' | head -1)
          export REL=$(adb shell getprop ro.build.version.release | tr -d '\r')
          export ABI=$(adb shell getprop ro.product.cpu.abi | tr -d '\r')
          export LOC=$(adb shell getprop persist.sys.locale | tr -d '\r'); [ -z "$LOC" ] && LOC=en-US
          export TZN=$(adb shell getprop persist.sys.timezone | tr -d '\r')
          cp -r appmeta/* "$RUN_DIR"/ 2>/dev/null || true
          export FG=$(adb shell "dumpsys activity activities | grep -c $GIL_PACKAGE" | tr -d '\r')
          python3 -c "import json,os;s=(os.environ.get('SZ','') or '').split('x');json.dump({'model':os.environ.get('MODEL') or 'Android emulator','api':os.environ.get('API'),'density':os.environ.get('DENS'),'width':(s+[''])[0],'height':(s+['',''])[1],'foregrounded':int(os.environ.get('FG') or 0)>0,'release':os.environ.get('REL'),'abi':os.environ.get('ABI'),'locale':os.environ.get('LOC'),'timezone':os.environ.get('TZN') or 'UTC','kind':'Android emulator (Google APIs image)','network':'Wi-Fi, unrestricted'}, open(os.environ['RD']+'/device.json','w'))"

          echo "== reproduce pass =="
          timeout 12m python getitlisted/crawler.py replay "$RUN_DIR" 3 >/dev/null 2>&1
          echo "reproduce exit $?"
          GIL_RUN_DIR="$RUN_DIR" python getitlisted/trust.py | head -1
          if [ "$GIL_SMOKE" = "1" ]; then
            python3 -c "import json,sys;d=sys.argv[1];s=json.load(open(d+'summary.json'))['summary'];print('screens',s['screens'],'actions',s['steps'],'perf',json.dumps(s.get('performance')));[print('FINDING',f['severity'],f['category'],f['title'],'|',f.get('reproduction','')) for f in json.load(open(d+'findings.trusted.json'))]" "$RUN_DIR"
            exit 0
          fi
          pip install -q pillow >/dev/null 2>&1
          GIL_RUN_DIR="$RUN_DIR" GIL_VIDEO_DIR=/tmp/vid python getitlisted/push.py 2>push.err | grep -E "published|inconclusive|uploaded"
          rc=${PIPESTATUS[0]}; [ $rc -eq 0 ] && echo "publish step ok" || { echo "::error::publish failed"; exit 1; }

      - name: Mark build done
        if: always() && env.BUILD_ID != ''
        run: cd getitlisted && python queue.py finish "$BUILD_ID" ${{ job.status == 'success' && 'ok' || 'failed' }}
