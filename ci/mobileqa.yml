# Drop this file into .github/workflows/ of the APP repo.
#
# What it does on every push to main / every PR / every release tag / nightly:
#   1. builds an installable test binary (Android APK on Linux, iOS simulator .app on macOS)
#   2. boots an emulator/simulator and an Appium server
#   3. runs `mobileqa ci` — replays the stored regression suite, then explores for new ground
#   4. uploads the HTML report + JUnit, commits the grown suite back, and FAILS the job
#      (blocking the release workflow) when the gate trips.
#
# Secrets to set once (repo → Settings → Secrets → Actions):
#   ANTHROPIC_API_KEY   the tester's brain
#   EXPO_TOKEN          (Expo/EAS apps) for `eas build --local`
#   QA_EMAIL / QA_PASSWORD   a throwaway test account for the app, if it has login
#   MOBILEQA_SLACK_WEBHOOK   optional
#
# Adjust the two "BUILD" steps for non-Expo apps (gradle assembleDebug / xcodebuild -sdk iphonesimulator).

name: Mobile QA agent

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 7 * * *"        # nightly — the "app has to work on its own" run
  workflow_dispatch:
    inputs:
      steps:
        description: exploration budget (actions)
        default: "300"

env:
  MOBILEQA_REPO: https://github.com/manan99991/mobileqa   # where the agent lives
  QA_EMAIL: ${{ secrets.QA_EMAIL }}
  QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  MOBILEQA_SLACK_WEBHOOK: ${{ secrets.MOBILEQA_SLACK_WEBHOOK }}

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # Native compile fills the runner's disk; evict toolchains we never touch (same fix as android-release.yml)
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af > /dev/null 2>&1 || true
          df -h /
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-qa-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-qa-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install app deps
        run: npm ci

      # ---- BUILD: a plain debug APK for the emulator's ABI only (no EAS, no signing, ~3x faster than a release build).
      # For a non-Expo app replace with: ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64
      - name: Build debug APK (expo prebuild + gradle, x86_64 only)
        run: |
          set -o pipefail
          npx expo prebuild --platform android --no-install 2>&1 | tee build.log
          cd android && ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon 2>&1 | tee -a ../build.log
          cd .. && cp android/app/build/outputs/apk/debug/app-debug.apk ./qa-build.apk && ls -la qa-build.apk

      - name: Install mobileqa + Appium
        run: |
          pip install "git+${MOBILEQA_REPO}"
          npm install -g appium
          appium driver install uiautomator2

      # The Gradle build leaves the runner nearly full; creating the AVD (system image + userdata)
      # then fails to boot with no output. Reclaim space — the APK is already copied to the repo root.
      - name: Reclaim disk before the emulator
        run: |
          rm -rf android/app/build android/build android/.gradle ~/.gradle/caches/transforms-* ~/.gradle/caches/build-cache-* 2>/dev/null || true
          npm cache clean --force 2>/dev/null || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Run the QA agent on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30                 # API 30 google_apis x86_64 is the most reliable image on CI runners
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set +e                                  # run to the end and report, never abort silently
            exec > >(tee mobileqa.log) 2>&1         # capture EVERYTHING the agent does, from here on
            echo "== env =="; python -V; which mobileqa || true; adb devices; ls -la qa-build.apk
            nohup appium --relaxed-security --log appium.log > /dev/null 2>&1 &
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:4723/status >/dev/null && break; sleep 2; done
            adb wait-for-device
            echo "== doctor =="
            python -m mobileqa.cli doctor qa/app.android.yaml || true
            echo "== explore + regress =="
            python -m mobileqa.cli ci qa/app.android.yaml --steps ${{ github.event.inputs.steps || 300 }}
            echo "== exit $? =="

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: mobileqa-android-report, path: reports/, retention-days: 30 }

      - name: Publish JUnit summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with: { report_paths: reports/**/junit.xml, check_name: "Mobile QA (Android)" }
      - name: Post failure details on the commit
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          {
            echo "### Mobile QA (Android) failed — run ${{ github.run_number }}"
            echo; echo '```'; (grep -n -iE "error|what went wrong|FAILED|No space|OutOfMemory" build.log | grep -v "^.*warning" | head -40; echo ...; tail -n 30 build.log) 2>/dev/null || echo "(no build log)"; echo '```'
            echo; echo '```'; tail -n 80 mobileqa.log 2>/dev/null || echo "(agent did not run)"; echo '```'
            echo; echo '```'; tail -n 40 appium.log 2>/dev/null || true; echo '```'
          } > comment.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@comment.md >/dev/null || true

      - name: Commit the grown suite
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "mobileqa-bot" && git config user.email "mobileqa@users.noreply.github.com"
          git add qa/suite && git diff --cached --quiet || (git commit -m "qa: suite grown by mobileqa run ${{ github.run_number }} [skip ci]" && git pull --rebase && git push)

  ios:
    # macOS minutes bill at 10x. Best-effort until the simulator build is proven green,
    # then remove continue-on-error so iOS blocks releases too.
    runs-on: macos-15
    timeout-minutes: 120
    continue-on-error: true
    # Manual only until the simulator build is green (macOS minutes cost 10x; the Xcode/SDK 57 toolchain
    # mismatch that breaks ios-release.yml breaks this too). Run from the Actions tab to retry.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ vars.XCODE_PICK || '26.2' }}.app/Contents/Developer" || true
          xcodebuild -version
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - name: Expose node to Xcode script phases
        run: echo "NODE_BINARY=$(command -v node)" >> "$GITHUB_ENV"

      # ---- BUILD (Expo/EAS). Needs an eas.json profile "qa-simulator" with ios.simulator: true.
      # For native iOS: xcodebuild -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build
      - name: Build iOS simulator app (EAS local)
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        run: |
          set -o pipefail
          npx eas-cli@latest build --platform ios --profile qa-simulator --local --non-interactive --output ./qa-build.tar.gz 2>&1 | tee build.log
          mkdir -p qa-build && tar -xzf qa-build.tar.gz -C qa-build
          echo "APP_PATH=$(find $PWD/qa-build -name '*.app' -maxdepth 2 | head -1)" >> $GITHUB_ENV

      - name: Install mobileqa + Appium + simulator
        run: |
          pip install "git+${MOBILEQA_REPO}"
          npm install -g appium
          appium driver install xcuitest
          UDID=$(xcrun simctl create "qa-iphone" "iPhone 15" | tail -1)
          xcrun simctl boot "$UDID"
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV

      - name: Run the QA agent on the simulator
        run: |
          nohup appium --relaxed-security --log appium.log > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4723/status >/dev/null && break; sleep 2; done
          xcrun simctl bootstatus "$SIM_UDID" -b
          mobileqa doctor qa/app.ios.yaml || true
          set -o pipefail
          mobileqa ci qa/app.ios.yaml --steps ${{ github.event.inputs.steps || 300 }} 2>&1 | tee mobileqa.log

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: mobileqa-ios-report, path: reports/, retention-days: 30 }
      - name: Publish JUnit summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with: { report_paths: reports/**/junit.xml, check_name: "Mobile QA (iOS)" }
      - name: Post failure details on the commit
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          {
            echo "### Mobile QA (iOS) failed — run ${{ github.run_number }}"
            echo; echo '```'; (grep -n -iE "error|what went wrong|FAILED|No space|OutOfMemory" build.log | grep -v "^.*warning" | head -40; echo ...; tail -n 30 build.log) 2>/dev/null || echo "(no build log)"; echo '```'
            echo; echo '```'; tail -n 80 mobileqa.log 2>/dev/null || echo "(agent did not run)"; echo '```'
            echo; echo '```'; tail -n 40 appium.log 2>/dev/null || true; echo '```'
          } > comment.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@comment.md >/dev/null || true
      - name: Commit the grown suite
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "mobileqa-bot" && git config user.email "mobileqa@users.noreply.github.com"
          git add qa/suite && git diff --cached --quiet || (git commit -m "qa: iOS suite grown by mobileqa run ${{ github.run_number }} [skip ci]" && git pull --rebase && git push)
