# Tenzy — Android. Repo: manan99991/putt-party-play (NATIVE Kotlin + Jetpack Compose, Gradle — NOT Expo).
# Build the test binary:   cd android && ./gradlew :app:assembleDebug
#   -> android/app/build/outputs/apk/debug/app-debug.apk
app:
  name: Tenzy
  path: ${TENZY_APK:-./app-debug.apk}   # the gradle debug APK; blank if already installed
  package: com.tenzy.toolkit             # applicationId
  activity: com.handytools.app.MainActivity   # namespace is com.handytools.app
  login: {}
  base_urls:
    - https://manan99991.github.io/tenzy/
    - https://manan99991.github.io/tenzy/privacy.html
  allow_destructive: false
  forbidden_texts: ["Subscribe", "Start free trial", "Buy", "Restore purchases", "Rate", "Send feedback", "Delete"]
  # Tenzy is built FOR automated testing: every tool is a deep-link route. The launch below unlocks Pro
  # and enables uitest mode (skips onboarding + paywall + crash dialog) so the agent reaches every tool.
  # The 30 tool route ids (drive each with: adb shell am start -n com.tenzy.toolkit/com.handytools.app.MainActivity -e route <id>):
  #   fitit scan studio video formatfix scrub cleaner qrwifi stitch shareready light contacts measure magnify
  #   procam gpsdash audiolab rest colorvision sorted textstudio translate voicenotes livecaptions shield lens
  #   memory datagrab describe vault
  goals:
    - "Open every one of the 30 tools (fitit, scan, studio, video, formatfix, scrub, cleaner, qrwifi, stitch, shareready, light, contacts, measure, magnify, procam, gpsdash, audiolab, rest, colorvision, sorted, textstudio, translate, voicenotes, livecaptions, shield, lens, memory, datagrab, describe, vault) and exercise each with sensible input, checking the result is correct"
    - "Free tier: the ~8 basic utilities work without Pro; AI and output tools show the Pro paywall, never a blank screen"
    - "Paywall shows $19.99/year, 3-day free trial, auto-renew and cancel terms; 'free' never appears without 'optional Pro subscription'"
    - "Every screen, modal and sub-screen has a visible Back or Done (store-review dead-end check)"
    - "Ads: an ad slot never covers a control; the app still works if the ad fails to load"
    - "Privacy policy and every external link open and are not 404"
    - "Rotate to landscape in two tools; nothing clipped; state kept"
    - "Background the app mid-tool and come back: input is preserved"
    - "Flashlight strobe/SOS and any timer-based tool stop cleanly when leaving the screen"
  known_issues: []
  # Route-seeding: the agent jumps straight into every tool via `am start … -e route <id>` (the same
  # intent extra the CI smoke uses), instead of hoping it taps its way across the 30-tool grid. Each
  # carries `-e uitest true` so onboarding/paywall interstitials are skipped and the tool renders.
  # Pro stays unlocked from the initial `-e route homepro` launch (same process), so Pro tools open too.
  launch_routes:
    - "-e route fitit -e uitest true"
    - "-e route scan -e uitest true"
    - "-e route studio -e uitest true"
    - "-e route video -e uitest true"
    - "-e route formatfix -e uitest true"
    - "-e route scrub -e uitest true"
    - "-e route cleaner -e uitest true"
    - "-e route qrwifi -e uitest true"
    - "-e route stitch -e uitest true"
    - "-e route shareready -e uitest true"
    - "-e route light -e uitest true"
    - "-e route contacts -e uitest true"
    - "-e route measure -e uitest true"
    - "-e route magnify -e uitest true"
    - "-e route procam -e uitest true"
    - "-e route gpsdash -e uitest true"
    - "-e route audiolab -e uitest true"
    - "-e route rest -e uitest true"
    - "-e route colorvision -e uitest true"
    - "-e route sorted -e uitest true"
    - "-e route textstudio -e uitest true"
    - "-e route translate -e uitest true"
    - "-e route voicenotes -e uitest true"
    - "-e route livecaptions -e uitest true"
    - "-e route shield -e uitest true"
    - "-e route lens -e uitest true"
    - "-e route memory -e uitest true"
    - "-e route datagrab -e uitest true"
    - "-e route describe -e uitest true"
    - "-e route vault -e uitest true"

device:
  platform: android
  name: Pixel_6_API_34
  appium_url: ${APPIUM_URL:-http://127.0.0.1:4723}
  extra_caps:
    appium:autoGrantPermissions: true
    # Unlock Pro + skip onboarding/paywall/crash-dialog so the agent gets into every tool.
    appium:optionalIntentArguments: "-e route homepro -e uitest true"

run:
  max_steps: 400
  max_minutes: 40
  check_links: true
  check_values: true
  check_a11y: true
  check_vision: true
  model: claude-sonnet-5-5
  suite_dir: qa/suite/android
  report_dir: reports
  fail_on: [critical, high]
